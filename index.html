<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- без масштабирования жестами: на телефоне касания идут в игру (джойстик, кнопки) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Шрифт с ивритом лежит в репозитории (assets/fonts), не на CDN -->
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <!-- добавленная на главный экран (iPhone, Android) игра открывается без адресной строки -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tanakh Game — прототип</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh; /* динамическая высота: адресная строка браузера не съедает место */
      background: #111;
      overflow: hidden;
    }
    /* Область игры — весь экран, кроме вырезов и скруглений (safe-area). На компьютере отступы
       нулевые, и всё как раньше. На тач логический размер игры подбирается под пропорции этой
       области (src/config.js, src/ui/Layout.js) — полос по бокам нет. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      touch-action: none; /* не прокручивать и не масштабировать страницу пальцем */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 с CDN: сборщик не нужен, работает на GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Порядок важен: конфиг → данные → системы → UI → сущности → сцены → точка входа.
       Обычные (не module) скрипты: сборщик не нужен. -->
  <script src="src/utils/phaserFixes.js"></script>
  <script src="src/config.js"></script>

  <!-- Данные. Новую зону добавляйте строкой src/data/maps/<id>.js ниже. -->
  <script src="src/data/items.js"></script>
  <script src="src/data/measures.js"></script>
  <script src="src/data/world.js"></script>
  <script src="src/data/disputes.js"></script>
  <script src="src/data/commentary.js"></script>
  <!-- «Спасители», часть А (Эхуд) -->
  <script src="src/data/maps/a1.js"></script>
  <script src="src/data/maps/a2.js"></script>
  <script src="src/data/maps/a3.js"></script>
  <script src="src/data/maps/a4.js"></script>
  <script src="src/data/maps/a5.js"></script>
  <script src="src/data/maps/barak_1.js"></script>
  <script src="src/data/maps/barak_2.js"></script>
  <script src="src/data/maps/barak_3.js"></script>
  <script src="src/data/maps/barak_4.js"></script>
  <!-- «Власть», часть А (Гидон) -->
  <script src="src/data/maps/g1.js"></script>
  <script src="src/data/maps/g2.js"></script>
  <script src="src/data/maps/g3.js"></script>
  <script src="src/data/maps/g4.js"></script>
  <script src="src/data/maps/g5.js"></script>
  <script src="src/data/maps/g6.js"></script>
  <script src="src/data/maps/b1.js"></script>
  <script src="src/data/maps/b2.js"></script>
  <!-- «Спасители», карта 3 «Слово и власть», часть А: Йифтах (Й1–Й3) -->
  <script src="src/data/maps/yiftach_1.js"></script>
  <script src="src/data/maps/yiftach_2.js"></script>
  <script src="src/data/maps/yiftach_3.js"></script>
  <script src="src/data/maps/yiftach_4.js"></script>
  <script src="src/data/maps/yiftach_5.js"></script>
  <script src="src/data/maps/yiftach_6.js"></script>
  <!-- демо (?map=demo) -->
  <script src="src/data/maps/village.js"></script>
  <script src="src/data/maps/field.js"></script>
  <script src="src/data/maps/city.js"></script>

  <script src="src/utils/pathfinding.js"></script>
  <script src="src/systems/Equipment.js"></script>

  <script src="src/entities/Player.js"></script>

  <script src="src/scenes/BootScene.js"></script>

  <script src="src/main.js"></script>

</html>
