<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanakh Game — прототип</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 с CDN: сборщик не нужен, работает на GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Порядок важен: сначала конфиг и данные, затем сущности, сцены и точка входа.
       Обычные (не module) скрипты работают и на GitHub Pages, и при открытии файла напрямую. -->
  <script src="src/config.js"></script>
  <script src="src/maps.js"></script>
  <script src="src/utils/pathfinding.js"></script>
  <script src="src/systems/Equipment.js"></script>
  <script src="src/ui/HealthBar.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Item.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/InventoryScene.js"></script>
  <script src="src/main.js"></script>

</html>
